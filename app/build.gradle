plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.xff.launch'
    compileSdk 36
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def sourceFile = "app-${variant.buildType.name}"
            //替换的字符串
            def replaceFile = "launch"+ "_v${variant.versionName}"
            outputFileName = output.outputFile.name.replace(sourceFile, replaceFile)
        }
    }
    defaultConfig {
        applicationId "com.xff.launch"
        minSdk 28
        targetSdk 36
        versionCode 118
        versionName "1.1.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Auto-generate version string resource
        resValue "string", "app_version", "版本 ${versionName}"

        // NDK configuration for ARM architectures
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}